name: ci

# Gate for non-desktop work. `bun run check` is the repo's single gate (typecheck +
# Biome + bun test + server smoke); the Playwright stack suite lives outside it, which
# is how five specs rotted silently against a changed UI. Both run here.
#
# Neither job needs OMP model credentials: the e2e specs create sessions over HTTP and
# render panes, they never send a prompt.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check (typecheck + lint + test + server smoke)
        run: bun run check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Playwright stack suite
        run: bun run e2e
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
