name: desktop

# Desktop builds for the Tauri shell (`apps/desktop`).
#
# `verify` (macOS) always runs: check, Rust unit tests, sidecar smoke.
# `windows` builds the Windows sidecar, proves the HTTP tool surface, and
#   produces the unsigned NSIS installer.
# `release` (macOS, tag-triggered) builds the unsigned, ad-hoc-signed DMG + zip
#   for internal installs and attaches them to a DRAFT GitHub release.
#
# No Apple Developer credentials are used anywhere: `dist:macos` builds with
# `--no-sign` and then ad-hoc signs the bundle, which is what macOS requires to
# launch an Apple-Silicon app. Gatekeeper still warns on downloaded copies; see
# docs/runbook.md ("Team installer").

permissions:
  contents: read

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --quiet
      - name: Build sidecar
        run: bun run build:desktop
      - name: Sidecar smoke
        run: bun run smoke:sidecar

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
      - name: Build sidecar
        run: bun run build:desktop
      - name: Sidecar smoke
        run: bun run smoke:sidecar
      - name: Tool probe
        run: bun scripts/smoke-tools.ts "apps/desktop/src-tauri/binaries/ai-gui-server-x86_64-pc-windows-msvc.exe"
      - name: Build app (nsis, unsigned)
        working-directory: apps/desktop
        run: bun run tauri build --no-sign
      - name: Bundle smoke
        run: bun run smoke:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ai-gui-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build installer (unsigned, ad-hoc signed)
        run: bun run dist:macos
      - uses: actions/upload-artifact@v4
        with:
          name: ai-gui-macos
          path: |
            dist/macos/*.dmg
            dist/macos/*.zip
          if-no-files-found: error
      - name: Attach to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/macos/*.dmg dist/macos/*.zip \
            --draft --title "$GITHUB_REF_NAME" \
            --notes "Unsigned, ad-hoc-signed macOS build (Apple Silicon). See docs/runbook.md for install steps."
