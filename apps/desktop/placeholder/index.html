<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Grove</title>
    <style>
      body { font-family: system-ui; padding: 2rem; }
      #error { color: #b00; white-space: pre-wrap; }
      button { margin-top: 1rem; padding: 0.4rem 1rem; }
    </style>
  </head>
  <body>
    <p id="msg">Starting Grove…</p>
    <p id="error" hidden></p>
    <button id="retry" type="button" hidden>Retry</button>
    <script>
      const err = new URLSearchParams(location.search).get('error');
      if (err) {
        document.getElementById('msg').textContent = 'Grove failed to start.';
        const box = document.getElementById('error');
        box.textContent = err;
        box.hidden = false;
        document.getElementById('retry').hidden = false;
      }
      document.getElementById('retry').onclick = () => {
        document.getElementById('retry').hidden = true;
        document.getElementById('msg').textContent = 'Restarting…';
        window.__TAURI__.core.invoke('restart_sidecar');
      };
    </script>
  </body>
</html>
